# The single required status is the `checks` gate job (ADR 38): adding a
# shard or a job means editing this file, never the branch-protection list.
name: checks

on:
  push:
    branches: [main]
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore || true
      - run: dotnet build Premise.slnx -c Release
      - name: Format check
        run: dotnet csharpier check .
      - name: Architecture tests
        run: dotnet test tests/Premise.ArchitectureTests -c Release --no-build
      - name: Wolverine codegen (catches fails-at-first-request wiring at CI time)
        run: dotnet run --project src/Premise.Api -c Release --no-build -- codegen write
        env:
          ConnectionStrings__premise: "Host=localhost;Port=1;Database=x;Username=x;Password=x"
          ASPNETCORE_ENVIRONMENT: Testing
          ROLE: api
      - name: "Fork sync: the SECOND sync is the one that broke (item 15)"
        run: |
          git config --global user.email ci@example.com
          git config --global user.name CI
          tests/sync-upstream.test.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Unit tests (discovered by *.UnitTests.csproj - pure logic only)
        run: |
          found=0
          for project in tests/*.UnitTests/*.UnitTests.csproj; do
            found=1
            dotnet test "$project" -c Release
          done
          [ "$found" = "1" ] || { echo "no unit-test projects found"; exit 1; }

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build tests/Premise.IntegrationTests -c Release
      - name: Integration shard ${{ matrix.shard }}/2 (real PostgreSQL via Testcontainers)
        # A fresh shuffle seed each run: order-dependence between tests is
        # invisible until something perturbs the order (a fork's rename did
        # exactly that and surfaced two at once). The seed is echoed so a
        # failure can be replayed exactly: PREMISE_TEST_SHUFFLE=<seed>.
        run: |
          export PREMISE_TEST_SHUFFLE=$RANDOM
          echo "test order seed: $PREMISE_TEST_SHUFFLE (replay with PREMISE_TEST_SHUFFLE=$PREMISE_TEST_SHUFFLE)"
          CONFIGURATION=Release tools/run-integration-shard.sh ${{ matrix.shard }} 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-shard-${{ matrix.shard }}
          path: tests/Premise.IntegrationTests/TestResults/*.trx

  contract:
    # the committed OpenAPI document and generated client must match the code:
    # an API change is a reviewable diff in the same PR, or CI fails (ADR 38)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate contract snapshot
        run: |
          dotnet test tests/Premise.IntegrationTests -c Release \
            --filter "FullyQualifiedName~OpenApiSnapshotTest"
          dotnet run --project tools/Premise.Tools.CodegenKeys -c Release
      - name: Regenerate typed client
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @premise/codegen generate
      - name: Contract drift is a build failure
        run: git diff --exit-code web/packages/api

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate the public app's route tree
        # routeTree.gen.ts is committed so a fresh checkout typechecks, which
        # means it can go STALE: a fork adding a route gets three misleading
        # type errors until something regenerates it. Same treatment as
        # openapi.json - regenerate, then fail on drift.
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter public run routes
      - name: Route tree drift is a build failure
        run: git diff --exit-code web/apps/public/src/routeTree.gen.ts
      - name: Typecheck
        working-directory: web
        run: pnpm typecheck
      - name: Lint (ADR 20 barrel rule)
        working-directory: web
        run: pnpm lint
      - name: Unit tests
        working-directory: web
        run: pnpm test
      - name: Build
        working-directory: web
        run: pnpm build

  image:
    # The production artifact, built and smoked: one non-root OCI image from
    # `dotnet publish` (no Dockerfile to drift), pre-generated Wolverine code
    # inside it, and all three ROLEs booted from it in Production mode against
    # a real PostgreSQL - which is also the boot guards' negative control: a
    # production-valid configuration must NOT be refused.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/Premise.Api -c Release
      - name: Pre-generate Wolverine handler code into the artifact
        run: dotnet run --project src/Premise.Api -c Release --no-build -- codegen write
        env:
          ConnectionStrings__premise: "Host=localhost;Port=1;Database=x;Username=x;Password=x"
          ASPNETCORE_ENVIRONMENT: Testing
          ROLE: api
      - name: Publish the image
        run: |
          dotnet publish src/Premise.Api -c Release -p:PublishProfile=DefaultContainer \
            -p:ContainerImageTag=ci -p:Version=0.0.0-ci
          docker image inspect premise:ci --format 'user={{.Config.User}} ports={{.Config.ExposedPorts}}'
      - name: Smoke the three roles from the image
        run: tools/smoke-image.sh premise:ci

  checks:
    # the one status branch protection requires
    needs: [architecture, unit, integration, contract, frontend, image]
    runs-on: ubuntu-latest
    steps:
      - run: echo "all checks green"
